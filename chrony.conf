# Upstream NTP sources
pool pool.ntp.org iburst

# Clock synchronization and persistent drift data
driftfile /var/lib/chrony/drift
makestep 1.0 3
rtcsync

# Permit NTP clients on your LAN.
# Change this subnet to match your network.
allow 192.168.X.X/24
allow 127.0.0.1

# Provide local time if upstream sources become unavailable.
local stratum 10

# NTP service
port 123

# Logs
logdir /var/log/chrony
log tracking measurements statistics
